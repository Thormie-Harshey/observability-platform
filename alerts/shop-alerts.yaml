apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  namespace: monitoring
spec:
  groups:
    - name: shop.rules
      rules:
        - alert: HighErrorRate
          expr: |
            sum by (job) (rate(http_request_duration_seconds_count{namespace="shop", status_code=~"5.."}[5m]))
              / sum by (job) (rate(http_request_duration_seconds_count{namespace="shop"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }}: more than 5% of requests are failing"
            description: "{{ $labels.job }} has returned 5xx for {{ $value | humanizePercentage }} of requests over 5 minutes."
            runbook_url: https://github.com/Thormie-Harshey/observability-platform/blob/main/runbooks/high-error-rate.md

        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99, sum by (job, le) (rate(http_request_duration_seconds_bucket{namespace="shop"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }}: p99 latency above 1 second"
            description: "The slowest 1% of {{ $labels.job }} requests take {{ $value | humanizeDuration }} or more."
            runbook_url: https://github.com/Thormie-Harshey/observability-platform/blob/main/runbooks/high-latency.md

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="shop"}[1h]) > 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in {{ $labels.pod }} restarted {{ $value | humanize }} times in the last hour."
            runbook_url: https://github.com/Thormie-Harshey/observability-platform/blob/main/runbooks/pod-crash-looping.md

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has not reported Ready for 2 minutes. Pods on it may not run."
            runbook_url: https://github.com/Thormie-Harshey/observability-platform/blob/main/runbooks/node-not-ready.md

        - alert: DiskSpaceLow
          expr: |
            100 * node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk on {{ $labels.instance }} is below 10% free"
            description: "Only {{ $value | humanize }}% free on /var. Images, logs and Loki or Tempo data may stop being written."
            runbook_url: https://github.com/Thormie-Harshey/observability-platform/blob/main/runbooks/disk-space-low.md
