apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: shop
  labels:
    app: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: thormie/ecommerce-product:v1.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CACHE_TTL_SECONDS
              value: "60"
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: ecommerce
            - name: PGDATABASE
              value: ecommerce
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NODE_OPTIONS
              value: --require ./tracing.js
            - name: OTEL_SERVICE_NAME
              value: product
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          ports:
            - containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: shop
  labels:
    app: product
spec:
  selector:
    app: product
  ports:
    - name: http
      port: 3001
---
